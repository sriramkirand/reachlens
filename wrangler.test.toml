# Test-only config: local bindings only, so CI needs no Cloudflare credentials.
name = "reachlens-test"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "test"
BETTER_AUTH_URL = "http://localhost"
MAX_UPLOAD_BYTES = "10485760"

[[d1_databases]]
binding = "DB"
database_name = "reachlens-test"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "reachlens-images-test"

[[queues.producers]]
binding = "EXTRACT_QUEUE"
queue = "reachlens-extract-test"
