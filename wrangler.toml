name = "reachlens"
main = "src/worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[ai]
binding = "AI"

[vars]
APP_ENV = "dev"
BETTER_AUTH_URL = "http://localhost:5173"
MAX_UPLOAD_BYTES = "10485760"

[[d1_databases]]
binding = "DB"
database_name = "reachlens"
database_id = "e2b44ae6-e020-4ef8-9d7a-7948475c6b78" # replace: wrangler d1 create reachlens
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "reachlens-images"

[[queues.producers]]
binding = "d371d2198cda45078dc5b72f45ccf60d"
queue = "reachlens-extract"

[[queues.consumers]]
queue = "reachlens-extract"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 3
max_concurrency = 10
dead_letter_queue = "reachlens-extract-dlq"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["17 3 * * *"] # daily retention sweep

# ---------- staging ----------
[env.staging]
name = "reachlens-staging"
vars = { APP_ENV = "staging", BETTER_AUTH_URL = "https://reachlens-staging.example.workers.dev", MAX_UPLOAD_BYTES = "10485760" }
ai = { binding = "AI" }
assets = { directory = "./dist/client", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/api/*"] }
triggers = { crons = ["17 3 * * *"] }
d1_databases = [{ binding = "DB", database_name = "reachlens-staging", database_id = "REPLACE_STAGING_ID", migrations_dir = "migrations" }]
r2_buckets = [{ binding = "IMAGES", bucket_name = "reachlens-images-staging" }]
queues = { producers = [{ binding = "EXTRACT_QUEUE", queue = "reachlens-extract-staging" }], consumers = [{ queue = "reachlens-extract-staging", max_batch_size = 5, max_retries = 3, dead_letter_queue = "reachlens-extract-dlq-staging" }] }
unsafe = { bindings = [{ name = "RATE_LIMITER", type = "ratelimit", namespace_id = "2001", simple = { limit = 120, period = 60 } }] }

# ---------- production ----------
[env.production]
name = "reachlens"
vars = { APP_ENV = "production", BETTER_AUTH_URL = "https://reachlens.example.com", MAX_UPLOAD_BYTES = "10485760" }
ai = { binding = "AI" }
assets = { directory = "./dist/client", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/api/*"] }
triggers = { crons = ["17 3 * * *"] }
d1_databases = [{ binding = "DB", database_name = "reachlens-prod", database_id = "REPLACE_PROD_ID", migrations_dir = "migrations" }]
r2_buckets = [{ binding = "IMAGES", bucket_name = "reachlens-images-prod" }]
queues = { producers = [{ binding = "EXTRACT_QUEUE", queue = "reachlens-extract-prod" }], consumers = [{ queue = "reachlens-extract-prod", max_batch_size = 5, max_retries = 3, dead_letter_queue = "reachlens-extract-dlq-prod" }] }
unsafe = { bindings = [{ name = "RATE_LIMITER", type = "ratelimit", namespace_id = "3001", simple = { limit = 120, period = 60 } }] }
